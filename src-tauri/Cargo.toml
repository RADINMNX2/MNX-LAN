[package]
name = "mnx-lan"
version = "0.1.2"
description = "MNX LAN - ultra-lightweight zero-latency Virtual LAN for LAN gaming over the internet"
authors = ["RADIN MNX"]
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
wintun = "0.5.1"
stun = "0.17.2"
socket2 = { version = "0.6", features = ["all"] }
rand = "0.8.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
log = "0.4.27"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"