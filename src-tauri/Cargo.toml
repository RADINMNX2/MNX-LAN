[package]
name = "mnx-lan"
version = "0.1.3"
description = "MNX LAN — zero-latency Virtual LAN Gaming Suite"
authors = ["RADIN MNX"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
wintun = "0.5.1"
stun = "0.17.2"
socket2 = "0.5"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_Shell"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true