name: build-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Verify wintun.dll is provisioned
        shell: pwsh
        run: |
          $dll = Get-Item src-tauri/assets/wintun.dll
          if ($dll.Length -lt 100000) { throw "wintun.dll looks too small ($($dll.Length) bytes)" }
          Write-Host "wintun.dll OK: $($dll.Length) bytes"

      - name: Build and bundle (Release)
        run: npm run tauri build -- --verbose

      - name: Assert release binary under 12 MB budget
        shell: pwsh
        run: |
          $exe = Get-Item "src-tauri\target\release\mnx-lan.exe"
          $mb = [math]::Round($exe.Length / 1MB, 2)
          if ($exe.Length -gt 12MB) { throw "size budget exceeded: $mb MB > 12 MB" }
          Write-Host "Binary: $mb MB (within 12 MB budget)"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MNX-LAN-windows
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/assets/wintun.dll
            src-tauri/target/release/bundle/**/*.msi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*.exe